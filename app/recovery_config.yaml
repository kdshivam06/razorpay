# Tunable thresholds
#
# Confidence ladder (Track F.2) — how much autonomy the optimizer grants a
# case based on the trained propensity model's real P(payment within the
# horizon) for THAT specific case. Never a hardcoded or invented number.
#
# Spec bands (docs/implementation_plan.md §5 / F.2 requirements):
#   >= low        → human review
#   >= low..high  → automated, but channel chosen via channel_affinity.py
#                   and contact_fatigue.py
#   medium..high  → automated AI voice nudge (E.8 voice agent)
#   >= high       → SMS/WhatsApp reminder + payment link (fully automatic)
#
# NOTE ON THE ACTIVE VALUES:
#   The F.2 spec proposed 0.80 / 0.70 / 0.60 for these three thresholds, but
#   running the trained propensity_v1 model over data/synthetic_batch.csv
#   (2 184 rows) gives mean 0.424 and <0.60 for 1 817 rows (83%) — the spec
#   bands do NOT spread realistically over the real model distribution.  So the
#   active values below are tuned to the actual percentiles (quantiles 0.35 /
#   ~0.50 / 0.60) instead of forcing the data to fit.  They are named,
#   commented, and tunable here; the engine honours whatever values land here.
confidence_ladder:
  high_threshold: 0.60
  medium_threshold: 0.50
  low_threshold: 0.35
  horizon_hours: 168